# Adds German alongside English. Layered on top of vendor/presidio via
# analyzer-multilingual/Dockerfile — never edits the vendored submodule.
# Started as a copy of vendor/presidio/presidio-analyzer/presidio_analyzer/conf/default.yaml's
# ner_model_configuration; adjust the mapping once real German spaCy output is confirmed
# (de_core_news_lg's NER label set is smaller than English's and not yet verified here).
nlp_engine_name: spacy
models:
  - lang_code: en
    model_name: en_core_web_lg
  - lang_code: de
    model_name: de_core_news_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    NORP: NRP
    FAC: LOCATION
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME
    MISC: MISC

  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
  -
  labels_to_ignore:
  - ORGANIZATION # Has many false positives
  - CARDINAL
  - EVENT
  - LANGUAGE
  - LAW
  - MONEY
  - ORDINAL
  - PERCENT
  - PRODUCT
  - QUANTITY
  - WORK_OF_ART
