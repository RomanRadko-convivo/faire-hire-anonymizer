services:
  # Optional: only needed if presidio-analyzer's recognizer registry is
  # reconfigured to enable BasicLangExtractRecognizer (an LLM-based
  # extractor). It's `enabled: false` in upstream's default recognizer
  # config, and app.py never touches Ollama at startup either way — so the
  # base /analyze (spaCy-driven) flow works without this service at all.
  # `docker compose up` (no profile) skips it entirely; enable explicitly
  # with `docker compose --profile llm-extraction up`.
  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    profiles: ["llm-extraction"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  presidio-analyzer:
    build:
      context: ./vendor/presidio/presidio-analyzer
    environment:
      - PORT=5001
      # Only consulted if BasicLangExtractRecognizer is explicitly enabled
      # (see the ollama service note above) — harmless otherwise.
      - OLLAMA_HOST=http://ollama:11434
    # No `ports:` mapping — only reachable on the internal Docker network,
    # never on the host. The gateway service is the sole entry point.
    # No `depends_on: ollama` — the default recognizer config never calls
    # it, so analyzer doesn't need it to start or be healthy.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  presidio-anonymizer:
    build:
      context: ./vendor/presidio/presidio-anonymizer
    environment:
      - PORT=5001
    # No `ports:` mapping — same reasoning as presidio-analyzer above.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      - ANALYZER_URL=http://presidio-analyzer:5001
      - ANONYMIZER_URL=http://presidio-anonymizer:5001
    ports:
      # No auth on this service (network-only access control, by decision —
      # see README.md "Deployment / network exposure"). Bind host defaults to
      # all interfaces for local dev convenience, but production deployment
      # on company hardware MUST restrict this to the internal network — set
      # GATEWAY_BIND_HOST to that interface's IP in .env, and/or enforce it
      # with a host firewall rule. This service must never be reachable from
      # the public internet.
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  ollama-data:

# Note: upstream's docker-compose.yml also ships presidio-image-redactor.
# It's intentionally omitted here — FairHire's CV pipeline is text-only, and
# every service not deployed is attack surface not present.
